version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: autoryx-db
    restart: always
    environment:
      POSTGRES_USER: autoryx
      POSTGRES_PASSWORD: autoryx_secure_password
      POSTGRES_DB: autoryx
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoryx"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: autoryx-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: autoryx-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://autoryx:autoryx_secure_password@db:5432/autoryx
      - REDIS_URL=redis://redis:6379/0
      - GITHUB_OWNER=${GITHUB_OWNER:-Highorder-Thinking}
      - GITHUB_REPO=${GITHUB_REPO:-Step_semester_3}
      - GITHUB_DEFAULT_BRANCH=${GITHUB_DEFAULT_BRANCH:-main}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: autoryx-worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://autoryx:autoryx_secure_password@db:5432/autoryx
      - REDIS_URL=redis://redis:6379/0
      - GITHUB_OWNER=${GITHUB_OWNER:-Highorder-Thinking}
      - GITHUB_REPO=${GITHUB_REPO:-Step_semester_3}
      - GITHUB_DEFAULT_BRANCH=${GITHUB_DEFAULT_BRANCH:-main}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - storage_data:/app/storage

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: autoryx-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  storage_data:
